  analysis_notes:
  - skráin segir að greinin endi á bls. 182, prentuð lokasíða er bls. 181
  - 'FRÁVIK: á eftir greininni hefst „Mat Hæstaréttar á sönnunargögnum og sönnunarfærslu er af allt öðrum toga spunnið en
    það eftirlit, sem rétturinn á að hafa með málsmeðferðinni allri. Stundum fer þetta tvennt saman, en svo þarf þó alls ekki
    að vera. Það er því í sjálfu sér ekkert úrslitaatriði, hvort beinlínis verði ráðið af dómi, hvaða áhrif hin aðfinnsluverðu
    vinnubrögð hafi haft á niðurstöðu málsins. Það sem skiptir máli er hitt, að Hæstiréttur geri það Ijóst í úrlausn sinni,
    þegar hann telur brýna nauðsyn til, að tiltekin atriði í meðferð máls hafi ekki verið réttmæt eða eðlileg. Með slíkum
    leiðbeiningum stuðlar Hæstiréttur fyrir sitt leyti að betra og traustara réttarkerfi í landinu án þess þó að krenkja valdsvið
    framkvæmdarvaldsins. í þessu Ijósi er það fjarri lagi, að dómarar taki upp þann hátt, sem Bogi Nilsson bendir á, að snúa
    sér til umboðsmanns Alþingis með umkvartanir vegna stjórnsýslunnar, sbr. lög nr. 13/1987 um umboðsmann Alþingis. Slík
    vinnubrögð eru úr tengslum við eðli þess tilgangs, er aðfinnslur í dómi eiga að hafa og ekki í verkahring dómsvaldsins.
    Samkvæmt 2. gr. stjórnarskrárinnar er þjóðfélagsvaldi skipt milli þriggja aðila, er hver um sig skal óskorað fara með
    sinn þátt. Því sérstaka eftirlitshlutverki Hæstaréttar, sem hér er gert að umtalsefni, er með engu móti ætlað að takmarka
    það svigrúm, sem til þess bærir handhafar framkvæmdarvaldsins hafa til þess til dæmis að veita lögreglustjórum faglegar
    áminningar eða setja fram aðfinnslur við störf þeirra og lögreglunnar og eftir atvikum að beita agavaldi. Þessari skyldu
    hefur því ekki létt af Hæstarétti, þótt skilið hafi verið með nýrri löggjöf milli framkvæmdarvalds og dómsvalds í héraði
    og dómarar fari ekki lengur með málsrannsóknir á sama hátt og áður var. Þetta hlutverk Hæstaréttar er þvert á móti og
    verður áfram meðal hornsteina þess réttarkerfis, er bezt getur tryggt öllum borgurum landsins réttmæta og sanngjarna málsmeðferð
    frá fyrstu stundu til hinnar síðustu“ á bls. 182 sem skráin nefnir ekki; greinin er talin enda þar'
