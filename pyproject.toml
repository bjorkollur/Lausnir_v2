[project]
name = "lausnir"
version = "2.0.0"
description = "Íslenskt lögfræðigagnasafn — nýr grunnur"
requires-python = ">=3.13"
dependencies = [
    # HTTP
    "httpx",
    "feedparser",
    "beautifulsoup4",
    # PDF
    "pdfplumber",
    "PyMuPDF",
    # DB
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pgvector",
    # AI
    "anthropic",
    # API
    "fastapi",
    "uvicorn",
    # Utils
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "rich",
    "apscheduler",
    "psycopg2-binary>=2.9.12",
    "graphifyy>=0.8.14",
    "playwright>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
