# Draft — pending user review (dagsetning 2026-09-27).
#
# Þessi 50 spurninga voru valin úr 70 frambjóðendum sem
# scripts/golden_candidates.py dró (Hæstiréttur/Landsréttur, reifun 300-1500
# stafir, dreift á ár frá 2010). Fullur frambjóðendalisti með reifunartexta
# er varðveittur í /tmp/lausnir-dev/golden_candidates.yaml til endurskoðunar.
#
# Aðferð: hverri spurningu var handskrifuð af lesanda reifunarinnar, umorðuð
# (samheiti/önnur beygingarmynd, ekkert málsnúmer, engin setning tekin beint
# upp úr reifuninni), 3-10 orð eins og lögfræðingur myndi slá inn í leitarreit,
# með áherslu á lagalegt álitaefni fremur en tilfallandi staðreyndir málsins.
# Blanda: 20 einkamál, 11 sakamál (færri í boði meðal frambjóðenda en
# markmiðið 15), 5 stjórnsýslumál fyrir dómstólum, 14 kærumál/réttarfarsmál
# — samtals 50, dreift yfir 2009-2026.
#
# `note`-sviðið úr frambjóðendaskránni (reifunartextinn) hefur verið fjarlægt
# hér þar sem það myndi gera prófið að afritunarprófi.
